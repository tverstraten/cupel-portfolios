name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            binary: src-tauri/target/release/cupel.exe
            artifact: cupel-windows.exe
          - platform: macos-latest
            binary: src-tauri/target/release/cupel
            artifact: cupel-macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Fetch Pyodide runtime
        run: node scripts/fetch-pyodide.mjs

      - name: Build
        run: npm run build:exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Latest build from the master branch.
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          artifacts: artifacts/*
